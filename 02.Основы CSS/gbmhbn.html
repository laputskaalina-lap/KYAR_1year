<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа №2</title>
    <style>
        h1 + p{
            background-color: yellow;
        }
        h2 ~ p {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Заголовок</h1>
    <p>Абзац</p>
    <p>Абзац</p>

    <h2>Заголовок</h2>
    <p>Абзац</p>
    <p>Абзац</p>
</body>
</html>
